<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Buddhist Q&A</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f7f7f8;--chat-bg:#fff;--user-bg:#e8f5e9;
  --bot-bg:#fff;--border:#e5e5e5;--text:#333;--text2:#666;
  --primary:#2e7d32;--primary-hover:#1b5e20;--shadow:0 1px 3px rgba(0,0,0,.08);
  --radius:16px;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6}

/* layout */
.app{display:flex;flex-direction:column;height:100dvh;max-width:820px;margin:0 auto;background:var(--chat-bg);box-shadow:0 0 20px rgba(0,0,0,.06)}

/* header */
.header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--chat-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.header h1{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.header .logo{font-size:22px}
.header .actions{display:flex;gap:8px}
.btn-icon{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--chat-bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;transition:background .15s}
.btn-icon:hover{background:var(--bg)}

/* messages */
.messages{flex:1;overflow-y:auto;padding:16px 18px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.messages::-webkit-scrollbar{width:5px}
.messages::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}

.msg{display:flex;gap:10px;margin-bottom:20px;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse}
.avatar{width:32px;height:32px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px}
.msg.bot .avatar{background:var(--primary);color:#fff}
.msg.user .avatar{background:#1565c0;color:#fff}
.bubble{max-width:80%;padding:12px 16px;border-radius:var(--radius);line-height:1.7;white-space:pre-wrap;word-break:break-word;box-shadow:var(--shadow)}
.msg.bot .bubble{background:var(--bot-bg);border:1px solid var(--border);border-top-left-radius:4px}
.msg.user .bubble{background:var(--user-bg);border-top-right-radius:4px}

/* typing indicator */
.typing{display:flex;gap:4px;padding:8px 0}
.typing span{width:7px;height:7px;border-radius:50%;background:#999;animation:bounce .6s infinite alternate}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{to{opacity:.3;transform:translateY(-4px)}}

/* welcome */
.welcome{text-align:center;padding:40px 20px;color:var(--text2)}
.welcome h2{font-size:20px;color:var(--text);margin-bottom:8px}
.welcome p{font-size:14px;margin-bottom:24px}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.suggest-btn{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--chat-bg);cursor:pointer;font-size:13px;color:var(--text);transition:all .15s;white-space:nowrap}
.suggest-btn:hover{border-color:var(--primary);color:var(--primary);background:#f1f8e9}

/* input area */
.input-area{flex-shrink:0;padding:12px 18px;border-top:1px solid var(--border);background:var(--chat-bg)}
.input-wrap{display:flex;gap:8px;align-items:flex-end}
.input-wrap textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:14px;padding:10px 14px;font-size:15px;font-family:inherit;line-height:1.5;max-height:120px;min-height:44px;outline:none;transition:border-color .15s;background:var(--bg)}
.input-wrap textarea:focus{border-color:var(--primary)}
.input-wrap textarea::placeholder{color:#aaa}
.send-btn{width:44px;height:44px;border-radius:12px;border:none;background:var(--primary);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;transition:background .15s}
.send-btn:hover{background:var(--primary-hover)}
.send-btn:disabled{background:#ccc;cursor:not-allowed}
.mode-toggle{font-size:12px;color:var(--text2);padding:6px 0 0;display:flex;align-items:center;gap:6px;user-select:none}
.mode-toggle label{cursor:pointer;display:flex;align-items:center;gap:3px}
.mode-toggle input{accent-color:var(--primary)}

/* mobile */
@media(max-width:600px){
  .app{box-shadow:none}
  .bubble{max-width:88%}
  .header h1{font-size:15px}
  .suggestions{flex-direction:column;align-items:center}
}
</style>
</head>
<body>

<div class="app">
  <!-- header -->
  <div class="header">
    <h1><span class="logo">&#9784;</span> Buddhist Q&amp;A</h1>
    <div class="actions">
      <button class="btn-icon" onclick="clearChat()" title="New chat">&#x2795;</button>
    </div>
  </div>

  <!-- messages -->
  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <h2>&#9784; Buddhist Knowledge Q&amp;A</h2>
      <p>Ask me anything about Buddhism.<br>You can type in Chinese or English.</p>
      <div class="suggestions">
        <button class="suggest-btn" onclick="askSuggestion(this)">Four Noble Truths</button>
        <button class="suggest-btn" onclick="askSuggestion(this)">How to start meditation?</button>
        <button class="suggest-btn" onclick="askSuggestion(this)">Heart Sutra</button>
        <button class="suggest-btn" onclick="askSuggestion(this)">Buddhist sects</button>
      </div>
    </div>
  </div>

  <!-- input -->
  <div class="input-area">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="Ask about Buddhism..."
        onkeydown="handleKey(event)" oninput="autoGrow(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()">&#x27A4;</button>
    </div>
    <div class="mode-toggle">
      <label><input type="radio" name="mode" value="brief" checked> Brief</label>
      <label><input type="radio" name="mode" value="full"> Detailed</label>
    </div>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const welcomeEl = document.getElementById('welcome');
let isLoading = false;
let history = [];

function getMode() {
  return document.querySelector('input[name="mode"]:checked').value;
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  });
}

function addMessage(role, text) {
  if (welcomeEl) welcomeEl.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const avatar = role === 'bot' ? '&#9784;' : '&#128100;';
  div.innerHTML = `<div class="avatar">${avatar}</div><div class="bubble">${escapeHtml(text)}</div>`;
  messagesEl.appendChild(div);
  scrollToBottom();
  return div;
}

function addTyping() {
  if (welcomeEl) welcomeEl.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typing';
  div.innerHTML = '<div class="avatar">&#9784;</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  messagesEl.appendChild(div);
  scrollToBottom();
}

function removeTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function askSuggestion(btn) {
  inputEl.value = btn.textContent;
  send();
}

function clearChat() {
  history = [];
  messagesEl.innerHTML = '';
  if (welcomeEl) {
    messagesEl.appendChild(welcomeEl);
    welcomeEl.style.display = '';
  }
  inputEl.value = '';
  inputEl.style.height = 'auto';
  inputEl.focus();
}

async function send() {
  const q = inputEl.value.trim();
  if (!q || isLoading) return;
  isLoading = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  inputEl.style.height = 'auto';

  addMessage('user', q);
  history.push({ role: 'user', content: q });
  addTyping();

  try {
    const resp = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, mode: getMode(), timeout_sec: 120 })
    });
    const data = await resp.json();
    removeTyping();

    const answer = data.answer || 'No answer available.';
    addMessage('bot', answer);
    history.push({ role: 'bot', content: answer });
  } catch (err) {
    removeTyping();
    addMessage('bot', 'Network error: ' + err.message);
  } finally {
    isLoading = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

// focus input on load
inputEl.focus();
</script>

</body>
</html>
